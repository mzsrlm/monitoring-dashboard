<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#17233c}
.dashboard{max-width:1600px;margin:auto;padding:18px}
.header{background:linear-gradient(135deg,#073866,#104d86);color:#fff;border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:0 5px 18px rgba(0,0,0,.12)}
.header h1{margin:0 0 6px;font-size:28px}.header p{margin:0;opacity:.88}
.overall{background:#fff;color:#17345d;border-radius:12px;display:grid;grid-template-columns:repeat(4,1fr);min-width:620px;overflow:hidden}
.overall div{padding:13px 18px;text-align:center;border-left:1px solid #dce4ee}.overall div:first-child{border-left:0}
.overall small{display:block;font-weight:700;font-size:12px;margin-bottom:5px}.overall strong{font-size:22px}
.controls{margin:18px 0;background:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.controls label{font-weight:700;font-size:14px}select,input,button{border:1px solid #ccd6e2;border-radius:7px;padding:9px 11px;background:#fff;font-size:14px}
input{min-width:220px}button{cursor:pointer;font-weight:700}button:hover{background:#eef5fc}
.status-btn.active-good{background:#e7f6ec;border-color:#8bc69c;color:#08752c}.status-btn.active-bad{background:#fdeaea;border-color:#e2a0a0;color:#b21f1f}.status-btn.active-all{background:#e9f1fb;border-color:#9bb9dc;color:#124b83}
#refreshBtn{background:#0d477d;color:#fff;border-color:#0d477d}
.kyc-refresh-btn{appearance:none;border:1px solid #9bb9dc;background:#e9f1fb;color:#124b83;width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;line-height:1;cursor:pointer;padding:0;transition:.15s ease;flex:0 0 auto}
.kyc-refresh-btn:hover{transform:rotate(30deg);background:#dceafa}
.kyc-refresh-btn:active{transform:rotate(120deg) scale(.96)}
.kyc-refresh-btn:disabled{opacity:.55;cursor:wait;transform:none}.status{font-size:12px;color:#63748a;margin-left:auto}.status.ok{color:#16753a}.status.error{color:#b52121}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.metric-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);border-top:4px solid #3178b9}
.metric-card h3{margin:0 0 6px;font-size:15px;color:#183e68}.metric-card .value{font-size:25px;font-weight:800}.metric-card .sub{font-size:12px;color:#66758a;margin-top:4px}
.panel{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;margin-bottom:18px}
.panel-title{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e1e7ef}.panel-title h2{margin:0;font-size:18px}.panel-title span{color:#6d7c91;font-size:12px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}
th,td{padding:10px 12px;border-bottom:1px solid #e9edf2;text-align:left;font-size:13px;white-space:nowrap}
th{background:#0d477d;color:#fff;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}th:hover{background:#155b98}
th .arrow{margin-left:5px;opacity:.7}tr:hover td{background:#f7faff}.good-row td:first-child{border-left:4px solid #219653}.bad-row td:first-child{border-left:4px solid #d93030}
.connectivity{font-weight:800;padding:5px 8px;border-radius:20px;display:inline-block;font-size:11px}.good{color:#117333;background:#e9f7ed}.bad{color:#b52121;background:#fdecec}
.bar-cell{min-width:175px}.bar{height:8px;width:100%;background:#edf1f5;border-radius:20px;overflow:hidden;margin-top:5px}.bar>span{display:block;height:100%;border-radius:20px}
.bank{background:#65b46f}.ekyc{background:#65a7dc}.mobile{background:#9a78c9}.pct{font-weight:800}
.legend{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px 18px;font-size:12px;color:#59697e}.legend span{display:flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.good-dot{background:#219653}.bad-dot{background:#d93030}
.footer{color:#6b788b;font-size:11px;padding:5px 3px 15px}.loading{padding:35px;text-align:center;color:#64748b}
@media(max-width:1100px){.header{flex-direction:column;align-items:stretch}.overall{min-width:0;width:100%}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.dashboard{padding:8px}.overall{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.header h1{font-size:22px}.overall strong{font-size:18px}.status{margin-left:0;width:100%}}

/* Percentage performance scale:
   80%+ = green, 30%-79.99% = yellow, below 30% = red.
   The classes intensify toward the stronger end of each range. */
.bar > span.pct-green-low { background:#8bcf8f; }
.bar > span.pct-green-mid { background:#4caf50; }
.bar > span.pct-green-high { background:#087f23; }
.bar > span.pct-yellow-low { background:#ffd54f; }
.bar > span.pct-yellow-mid { background:#f4b400; }
.bar > span.pct-yellow-high { background:#d89b00; }
.bar > span.pct-red-low { background:#b71c1c; }
.bar > span.pct-red-mid { background:#d93025; }
.bar > span.pct-red-high { background:#ef6c00; }
.pct-green-low, .pct-green-mid, .pct-green-high,
.pct-yellow-low, .pct-yellow-mid, .pct-yellow-high,
.pct-red-low, .pct-red-mid, .pct-red-high { transition:background .2s ease; }

/* Combined dashboard additions — KYC styles/code above remain unchanged */
.combo-tabs{display:flex;gap:8px;background:#fff;padding:8px;margin-top:18px;border-radius:12px 12px 0 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.combo-tab{border:0;background:#edf2f7;color:#25415f;padding:12px 25px;border-radius:8px;font-weight:800;cursor:pointer}
.combo-tab.active{background:#0d477d;color:#fff}.combo-panel{display:none}.combo-panel.active{display:block}.transactions-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#eef7f0;color:#16723b}.transactions-link:hover{background:#dff0e3}.transactions-link:visited{color:#16723b}
.extra-controls{margin:18px 0;background:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.extra-controls label{font-weight:700;font-size:14px}.extra-controls input,.extra-controls select{border:1px solid #ccd6e2;border-radius:7px;padding:9px 11px;background:#fff;font-size:14px}
.extra-controls input{min-width:240px}.extra-status{font-size:12px;color:#63748a;margin-left:auto}.extra-status.ok{color:#16753a}.extra-status.error{color:#b52121}
.extra-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.extra-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);border-top:4px solid #3178b9}
.extra-card h3{margin:0 0 6px;font-size:15px;color:#183e68}.extra-card .value{font-size:25px;font-weight:800}.extra-card .sub{font-size:12px;color:#66758a;margin-top:4px}
.extra-panel{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;margin-bottom:18px}
.extra-title{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e1e7ef}.extra-title h2{margin:0;font-size:18px}.extra-title span{color:#6d7c91;font-size:12px}
.extra-note{padding:12px 18px;font-size:12px;color:#59697e;border-bottom:1px solid #e9edf2}
.extra-table-wrap{overflow:auto}.extra-table{width:100%;border-collapse:collapse;min-width:1200px}
.extra-table th,.extra-table td{padding:10px 12px;border-bottom:1px solid #e9edf2;text-align:left;font-size:13px;white-space:nowrap}
.extra-table th{background:#0d477d;color:#fff;position:sticky;top:0;z-index:2;cursor:pointer}.extra-table tr:hover td{background:#f7faff}
.extra-pct-cell{min-width:230px}.extra-bar{height:9px;width:100%;background:#edf1f5;border-radius:20px;overflow:hidden;margin-top:5px}.extra-bar span{display:block;height:100%;border-radius:20px}
.extra-g1{background:#8bcf8f}.extra-g2{background:#4caf50}.extra-g3{background:#087f23}.extra-y1{background:#ffd54f}.extra-y2{background:#f4b400}.extra-y3{background:#d89b00}.extra-r1{background:#ef6c00}.extra-r2{background:#d93025}.extra-r3{background:#b71c1c}
.extra-good{color:#117333;background:#e9f7ed;font-weight:800;padding:5px 8px;border-radius:20px;font-size:11px}.extra-bad{color:#b52121;background:#fdecec;font-weight:800;padding:5px 8px;border-radius:20px;font-size:11px}
.extra-loading{padding:35px;text-align:center;color:#64748b}
@media(max-width:1100px){.extra-cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.combo-tabs{overflow:auto}.extra-cards{grid-template-columns:1fr}.extra-status{margin-left:0;width:100%}}

  width:100%!important;

  box-sizing:border-box!important;
  border-collapse:separate!important;
  border-spacing:0!important;
}
#transactionsComboPanel .tx-fixed-head-table th,
#transactionsComboPanel .tx-body-table td{
  box-sizing:border-box!important;
}

  overflow-x:auto!important;
  overflow-y:auto!important;
}

/* Keep progress content inside its exact cell width. */
#transactionsComboPanel .tx-body-table td:nth-child(7),
#transactionsComboPanel .tx-body-table td:nth-child(9),
#transactionsComboPanel .tx-body-table td:nth-child(11),

  padding-left:6px!important;

<script id="t01-v20-table-sync-fix">
(function(){
  function fixTxTableGeometry(){
    const area=document.getElementById('txTableArea');
    if(!area)return;
    const head=area.querySelector('.tx-fixed-head-table');
    const body=area.querySelector('.tx-body-table');
    const headWrap=area.querySelector('.tx-fixed-head-wrap');
    const bodyWrap=area.querySelector('.tx-body-wrap');
    if(!head||!body||!headWrap||!bodyWrap)return;

    const available=Math.max(0, bodyWrap.clientWidth - 1);
    if(available<=0)return;

    /* Same explicit width for both tables, preventing header/body drift. */
    head.style.width=available+'px';
    body.style.width=available+'px';
    head.style.minWidth='0';
    body.style.minWidth='0';

    const hcells=head.querySelectorAll('thead th');
    const brow=body.querySelector('tbody tr');
    if(!hcells.length||!brow)return;

    const bcells=brow.children;
    const widths=Array.from(hcells).map(c=>c.getBoundingClientRect().width);
    const sum=widths.reduce((a,b)=>a+b,0);
    const scale=sum>0 ? available/sum : 1;

    hcells.forEach((c,i)=>{
      if(!bcells[i])return;
      const w=widths[i]*scale;
      c.style.width=w+'px';
      c.style.minWidth=w+'px';
      c.style.maxWidth=w+'px';
      bcells[i].style.width=w+'px';
      bcells[i].style.minWidth=w+'px';
      bcells[i].style.maxWidth=w+'px';
    });
  }

  function bind(){
    fixTxTableGeometry();
    window.addEventListener('resize',fixTxTableGeometry);
    if(window.ResizeObserver){
      const area=document.getElementById('txTableArea');
      if(area)new ResizeObserver(fixTxTableGeometry).observe(area);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);
  else bind();
  setTimeout(fixTxTableGeometry,100);
  setTimeout(fixTxTableGeometry,500);
})();
</script>

function clean(v){return String(v??"").trim().replace(/\s+/g," ")}
function norm(v){return clean(v).toLowerCase().replace(/[^a-z0-9]/g,"")}
function num(v){let n=parseFloat(clean(v).replace(/,/g,"").replace("%",""));return Number.isFinite(n)?n:0}
function ratio(a,b){return b>0?(a/b)*100:0}

function parseCSV(text){
  const rows=[];let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch=='"' && quoted && next=='"'){cell+='"';i++;continue}
    if(ch=='"'){quoted=!quoted;continue}
    if(ch=="," && !quoted){row.push(cell);cell="";continue}
    if((ch=="\n"||ch=="\r")&&!quoted){
      if(ch=="\r"&&next=="\n")i++;
      row.push(cell);cell="";
      if(row.some(x=>clean(x)!==""))rows.push(row);
      row=[];continue
    }
    cell+=ch
  }
  if(cell.length||row.length){row.push(cell);if(row.some(x=>clean(x)!==""))rows.push(row)}
  return rows
}

function findHeader(rows){
  for(let i=0;i<Math.min(rows.length,15);i++){
    const h=rows[i].map(norm);
    const hasConn=h.some(x=>x==="connectivity"||x.includes("internetconnectivity"));
    const hasDistrict=h.some(x=>x==="district");
    const hasBlock=h.some(x=>x==="block");
    const hasMembers=h.some(x=>x==="members"||x.includes("nomembers"));
    const hasBank=h.some(x=>x.includes("bankac")||x.includes("bankaccount"));
    if(hasConn&&hasDistrict&&hasBlock&&hasMembers&&hasBank)return i;
  }
  return -1
}
function findCol(headers,terms){
  const h=headers.map(norm);
  for(const t of terms){let i=h.indexOf(norm(t));if(i>=0)return i}
  for(const t of terms){const n=norm(t);let i=h.findIndex(x=>x.includes(n));if(i>=0)return i}
  return -1
}
function colMap(headers){
  /* KYC columns are mapped by their exact Google Sheet positions A:L. */
  return {
    connectivity:0,
    district:1,
    block:2,
    members:3,
    bank:4,
    bankPct:5,
    aadhaar:6,
    ekyc:7,
    ekycPct:8,
    mobile:9,
    mobileVerified:10,
    mobilePct:11
  }
}
function buildKycDataExact(rows,headers){
  const c=colMap(headers);
  const out=[];
  for(const r of rows){
    const get=i=>clean(r[i]??"");
    const connectivity=get(c.connectivity),district=get(c.district),block=get(c.block);
    const members=num(get(c.members)),bank=num(get(c.bank)),aadhaar=num(get(c.aadhaar));
    const ekyc=num(get(c.ekyc)),mobile=num(get(c.mobile)),mobileVerified=num(get(c.mobileVerified));
    if(!district||!block||!members)continue;
    if(!["good","bad"].includes(connectivity.toLowerCase()))continue;
    /* Percentages are calculated exactly from the requested Google Sheet columns:
       F = E*100/D, I = H*100/G, L = K*100/J. */
    out.push({
      connectivity,district,block,members,bank,aadhaar,ekyc,mobile,mobileVerified,
      bankPct:members>0 ? bank*100/members : 0,
      ekycPct:members>0 ? ekyc*100/members : 0,
      mobilePct:mobile>0 ? mobileVerified*100/mobile : 0
    });
  }
  return out;
}

/*
 * Google Sheet Last Updated tab
 * --------------------------------
 * The dedicated LAST UPDATED worksheet stores one date per dashboard tab.
 * Recommended layout:
 *   Column A = Tab name (KYC, DAR, SURVEY, TRANSACTIONS, ...)
 *   Column B = Last Updated date/time
 *
 * The reader is intentionally tolerant of labels such as "KYC Last Updated"
 * and "Transactions Last Updated", so future tabs can be added without
 * changing this lookup logic.
 */
const LAST_UPDATED_GID="1632665078";
const LAST_UPDATED_RANGE="A:B";
const tabLastUpdated={kyc:"—",dar:"—",survey:"—",transactions:"—"};

function normaliseLastUpdatedLabel(v){
  return String(v??"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"");
}
function lastUpdatedKey(label){
  const n=normaliseLastUpdatedLabel(label);
  if(!n || n==="tab" || n==="section" || n==="module") return null;
  if(n.includes("transaction")) return "transactions";
  if(n.includes("survey")) return "survey";
  if(n.includes("dar")) return "dar";
  if(n.includes("kyc")) return "kyc";
  return null;
}
function setTabLastUpdated(key,value){
  const text=String(value??"").trim()||"—";
  tabLastUpdated[key]=text;
  const el=document.getElementById(key+"LastUpdated");
  if(el)el.textContent="Last updated: "+text;
}
function getTabLastUpdated(key){return tabLastUpdated[key]||"—";}

function parseLastUpdatedRows(json){
  if(!json||json.status==="error")throw new Error("LAST UPDATED sheet query failed.");
  const rows=json.table?.rows||[];
  const found={};
  for(const r of rows){
    const c=r.c||[];
    const label=String(c[0]?.f??c[0]?.v??"").trim();
    const value=String(c[1]?.f??c[1]?.v??"").trim();
    const key=lastUpdatedKey(label);
    if(key && value)found[key]=value;
  }
  return found;
}

function loadTabLastUpdated(){
  return new Promise(resolve=>{
    const callback="mzSrlmTabLastUpdated_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    let finished=false;
    const cleanup=()=>{if(finished)return;finished=true;try{delete window[callback]}catch(_){}script.remove()};
    const timer=setTimeout(()=>{cleanup();resolve(false)},10000);
    window[callback]=(json)=>{
      clearTimeout(timer);
      try{
        const found=parseLastUpdatedRows(json);
        Object.entries(found).forEach(([key,value])=>setTabLastUpdated(key,value));
        cleanup();resolve(Object.keys(found).length>0);
      }catch(err){console.warn("Could not read LAST UPDATED sheet:",err);cleanup();resolve(false)}
    };
    script.onerror=()=>{clearTimeout(timer);cleanup();resolve(false)};
    script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callback}&gid=${LAST_UPDATED_GID}&headers=0&range=${encodeURIComponent(LAST_UPDATED_RANGE)}&tq=${encodeURIComponent("select *")}&_=${Date.now()}`;
    document.head.appendChild(script);
  });
}

async function loadSheet(manualRefresh=false){
  const status=document.getElementById("status");
  status.className="status";status.textContent=manualRefresh?"Refreshing live KYC data…":"Loading live KYC data…";

  const parseGVIZObject=(json)=>{
    if(!json||json.status==="error")throw new Error(json?.errors?.[0]?.detailed_message||"Google Sheets query error.");
    const cols=json.table?.cols||[],rows=json.table?.rows||[];
    const headers=cols.map(c=>clean(c.label||c.id||""));
    if(!rows.length)throw new Error("KYC Google Sheet returned no rows.");
    const arr=buildKycDataExact(rows.map(r=>(r.c||[]).map(x=>x?.f??x?.v??"")),headers);
    if(!arr.length)throw new Error("No valid KYC block records found.");
    return arr;
  };

  try{
    /* JSONP avoids CORS problems when this HTML is opened directly or
       downloaded, while the timestamp prevents stale browser/proxy data. */
    const live=await new Promise((resolve,reject)=>{
      const cb="kycCB_"+Date.now()+"_"+Math.floor(Math.random()*100000);
      const s=document.createElement("script");
      const timer=setTimeout(()=>{cleanup();reject(Error("KYC live request timed out."))},15000);
      function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}
      window[cb]=json=>{cleanup();try{resolve(parseGVIZObject(json))}catch(e){reject(e)}};
      s.onerror=()=>{cleanup();reject(Error("KYC Google Sheet could not be accessed."))};
      s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&gid=${SHEET_GID}&headers=1&tq=${encodeURIComponent("select *")}&_=${Date.now()}`;
      document.head.appendChild(s);
    });
    data=live;
  }catch(jsonpErr){
    try{
      const response=await fetch(GVIZ_URL+"&t="+Date.now(),{cache:"no-store"});
      const text=await response.text();
      const match=text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
      if(!match)throw new Error("GVIZ endpoint did not return JSON.");
      data=parseGVIZObject(JSON.parse(match[1]));
    }catch(primaryErr){
      try{
        const csvResp=await fetch(CSV_URL+"&t="+Date.now(),{cache:"no-store"});
        if(!csvResp.ok)throw new Error("CSV HTTP "+csvResp.status);
        const rows=parseCSV(await csvResp.text()),hi=findHeader(rows);
        if(hi<0)throw new Error("Could not find the KYC header row in the published tab.");
        data=buildKycDataExact(rows.slice(hi+1),rows[hi]);
        if(!data.length)throw new Error("KYC header found but no valid block records were found.");
      }catch(fallbackErr){
        console.error(jsonpErr,primaryErr,fallbackErr);
        useFallback();
        status.className="status";
        status.textContent="Live KYC data unavailable — using embedded data";
        return;
      }
    }
  }

  updateOverall();render();
  await loadTabLastUpdated();
  status.className="status ok";
  status.textContent=data.length+" blocks loaded";
}

function updateOverall(){
  const members=data.reduce((s,r)=>s+r.members,0);
  const bank=data.reduce((s,r)=>s+r.bank,0),aad=data.reduce((s,r)=>s+r.aadhaar,0);
  const ekyc=data.reduce((s,r)=>s+r.ekyc,0),mob=data.reduce((s,r)=>s+r.mobile,0),mv=data.reduce((s,r)=>s+r.mobileVerified,0);
  /* The member-count card was intentionally removed from the KYC summary. */
  const setOverallPct=(id,v)=>{const el=document.getElementById(id);if(!el)return;el.textContent=Number(v).toFixed(2)+"%";el.className="value "+pctClass(Number(v));};
  setOverallPct("overallBank",members?bank/members*100:0);
  setOverallPct("overallEkyc",members?ekyc/members*100:0);
  setOverallPct("overallMobile",mob?mv/mob*100:0);
}
function filteredRows(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  return data.filter(r=>(statusFilter==="All"||r.connectivity.toLowerCase()===statusFilter.toLowerCase())&&(!q||r.district.toLowerCase().includes(q)||r.block.toLowerCase().includes(q)))
}
function sortData(a){return a.sort((x,y)=>{const vx=x[sortKey],vy=y[sortKey];return typeof vx==="string"?vx.localeCompare(vy)*sortDir:(vx-vy)*sortDir})}
function pctClass(v){
  if(v>=90) return "pct-green-high";
  if(v>=80) return "pct-green-mid";
  if(v>=60) return "pct-yellow-high";
  if(v>=50) return "pct-yellow-mid";
  if(v>=30) return "pct-red-high";
  return "pct-red-mid";
}
function bar(v){
  return `<div class="pct">${v.toFixed(2)}%</div><div class="bar"><span class="${pctClass(v)}" style="width:${Math.min(100,Math.max(0,v))}%"></span></div>`;
}
function render(){
  const arr=sortData(filteredRows()),body=document.getElementById("tableBody");
  if(!arr.length){body.innerHTML='<tr><td colspan="13" class="loading">No matching blocks found.</td></tr>';}
  else body.innerHTML=arr.map((r,i)=>`<tr class="${r.connectivity.toLowerCase()==="good"?"good-row":"bad-row"}">
    <td>${i+1}</td>
    <td><span class="connectivity ${r.connectivity.toLowerCase()==="good"?"good":"bad"}">${String(r.connectivity||"").trim().toLowerCase()==="good"?"Good":"Bad"}</span></td>
    <td>${r.district}</td>
    <td><strong>${r.block}</strong></td>
    <td>${r.members.toLocaleString("en-IN")}</td>
    <td>${r.bank.toLocaleString("en-IN")}</td>
    <td class="bar-cell">${bar(r.bankPct)}</td>
    <td>${r.aadhaar.toLocaleString("en-IN")}</td>
    <td>${r.ekyc.toLocaleString("en-IN")}</td>
    <td class="bar-cell">${bar(r.ekycPct)}</td>
    <td>${r.mobile.toLocaleString("en-IN")}</td>
    <td>${r.mobileVerified.toLocaleString("en-IN")}</td>
    <td class="bar-cell">${bar(r.mobilePct)}</td>
  </tr>`).join("");
  document.getElementById("blockCount").textContent=arr.length;updateCards(arr);updateArrows()
}
function updateCards(arr){
  if(!arr.length)return;
  const b=[...arr].sort((a,c)=>c.bankPct-a.bankPct)[0],e=[...arr].sort((a,c)=>c.ekycPct-a.ekycPct)[0],m=[...arr].sort((a,c)=>c.mobilePct-a.mobilePct)[0];
  const setKycPct=(id,v)=>{const el=document.getElementById(id);if(!el)return;el.textContent=Number(v).toFixed(2)+"%";el.className="value "+pctClass(Number(v));};
  setKycPct("bestBank",b.bankPct);document.getElementById("bestBankName").textContent=b.block;
  setKycPct("bestEkyc",e.ekycPct);document.getElementById("bestEkycName").textContent=e.block;
  setKycPct("bestMobile",m.mobilePct);document.getElementById("bestMobileName").textContent=m.block;
}
function sortTable(key){if(sortKey===key)sortDir*=-1;else{sortKey=key;sortDir=-1}if(document.getElementById("metric") && ["bankPct","ekycPct","mobilePct","members"].includes(key))document.getElementById("metric").value=key;document.getElementById("directionBtn").textContent=sortDir===-1?"Descending ↓":"Ascending ↑";render()}

function setStatus(s){statusFilter=s;document.getElementById("allBtn").className="status-btn"+(s==="All"?" active-all":"");document.getElementById("goodBtn").className="status-btn"+(s==="Good"?" active-good":"");document.getElementById("badBtn").className="status-btn"+(s==="Bad"?" active-bad":"");render()}
function updateArrows(){document.querySelectorAll(".arrow").forEach(x=>x.textContent="");const e=document.getElementById("arrow-"+sortKey);if(e)e.textContent=sortDir===-1?"▼":"▲"}
function resetDashboard(){document.getElementById("search").value="";sortKey="bankPct";sortDir=-1;document.getElementById("metric").value="bankPct";document.getElementById("directionBtn").textContent="Descending ↓";setStatus("All")}
async function refreshKycData(){

  }
}

/* === Upgrade: sort every dashboard table column === */
(function () {
  const sortState = new WeakMap();

  function parseCell(cell) {
    const raw = (cell?.textContent || "").trim();
    const normalized = raw.replace(/,/g, "").replace(/%/g, "");
    const n = Number(normalized);
    return {
      raw: raw.toLowerCase(),
      num: Number.isFinite(n) ? n : null
    };
  }

  document.addEventListener("click", function (event) {
    const th = event.target.closest("table thead th");
    if (!th) return;

    const table = th.closest("table");
    if (!table || !table.tBodies.length) return;

    const tbody = table.tBodies[0];
    const rows = Array.from(tbody.rows);
    if (rows.length < 2) return;

    const column = Array.from(th.parentElement.children).indexOf(th);
    if (column < 0) return;

    const direction = sortState.get(th) === "asc" ? "desc" : "asc";
    sortState.set(th, direction);

    table.querySelectorAll("thead th").forEach(function (other) {
      if (other !== th) sortState.delete(other);
    });

    rows.sort(function (a, b) {
      const A = parseCell(a.cells[column]);
      const B = parseCell(b.cells[column]);

      let result;
      if (A.num !== null && B.num !== null) {
        result = A.num - B.num;
      } else {
        result = A.raw.localeCompare(B.raw, undefined, {
          numeric: true,
          sensitivity: "base"
        });
      }

      return direction === "asc" ? result : -result;
    });

    rows.forEach(function (row) {
      tbody.appendChild(row);
    });

    // Re-number S.No. dynamically after sorting.
    Array.from(tbody.rows).forEach(function (row, index) {
      if (row.cells.length && row.cells[0]) {
        row.cells[0].textContent = String(index + 1);
      }
    });
  });
})();

(function(){
  function getPct(text){
    var m=String(text||'').replace(/,/g,'').match(/(-?\d+(?:\.\d+)?)\s*%/);
    return m ? Math.max(0,Math.min(100,parseFloat(m[1]))) : null;
  }

  function classify(v){
  v=Number(v)||0;
  if(v>=90)return ['pct-green-high'];
  if(v>=80)return ['pct-green-mid'];
  if(v>=60)return ['pct-yellow-high'];
  if(v>=50)return ['pct-yellow-mid'];
  if(v>=30)return ['pct-red-high'];
  return ['pct-red-mid'];
}

  function render(){
    document.querySelectorAll('td').forEach(function(td){
      if(td.dataset.pctBarProcessed==='1') return;
      var pct=getPct(td.textContent);
      if(pct===null) return;

      /* Only enhance cells that contain a percentage. */
      var original=td.textContent.trim();
      var classes=classify(pct);

      td.innerHTML =
        '<span class="mis-pct-value">'+original+'</span>'+
        '<div class="mis-pct-progress" aria-label="'+original+'">'+
          '<div class="mis-pct-progress-fill '+classes.join(' ')+'" style="width:'+pct+'%"></div>'+
        '</div>';

      td.dataset.pctBarProcessed='1';
    });
  }

  function start(){
    render();
    if(!document.body) return;

    var observer=new MutationObserver(function(){
      document.querySelectorAll('td[data-pct-bar-refresh]').forEach(function(td){
        td.removeAttribute('data-pct-bar-refresh');
        td.removeAttribute('data-pct-bar-processed');
      });
      setTimeout(render,40);
    });

    observer.observe(document.body,{childList:true,subtree:true,characterData:true});

    /* Sorting/filtering often replaces rows. Re-run periodically but only
       enhance newly-created percentage cells. */
    setInterval(render,700);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',start);
  }else{
    start();
  }
})();

  const monthRegex=/(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i;
  const monthMap={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
  const monthKeyFromHeader=h=>{const m=String(h??'').match(monthRegex);return m?monthMap[m[1].toLowerCase()]||0:0};
  const monthGroups={};
  ds.headers.forEach((h,i)=>{const mk=monthKeyFromHeader(h);if(mk)(monthGroups[mk]??=[]).push(i)});
  const months=Object.keys(monthGroups).map(Number).sort((a,b)=>a-b);

    const pctIdx=inds.find(i=>/%|percent|percentage|achievement|upload|uploaded/i.test(String(ds.headers[i])))??-1;
    const nonPct=inds.filter(i=>i!==pctIdx);
    // Transaction sheets use Month / Month (%) pairs. The non-percentage
    // column is the captured transaction count, regardless of its label.
    let totalIdx=nonPct.length===1?nonPct[0]:-1;
    if(totalIdx<0&&pctIdx>=0){
      const adjacent=[pctIdx-1,pctIdx+1].filter(i=>i>=0&&i<ds.headers.length);
      totalIdx=adjacent.find(i=>i!==pctIdx&&monthKeyFromHeader(ds.headers[i])===mk)??-1;
    }
    const labels=inds.map(i=>String(ds.headers[i]||''));
    const labelSource=labels.find(h=>/\b20\d{2}\b/.test(h))||labels[0]||'';
    const match=labelSource.match(monthRegex);
    const monthLabel=match?match[1]:new Date(2000,mk-1,1).toLocaleString('en-IN',{month:'long'});
    const yearMatch=(labels.join(' ').match(/\b(20\d{2})\b/)||[])[1]||'';
    const name=yearMatch?`${monthLabel} ${yearMatch}`:monthLabel;
    return{key:String(mk).padStart(2,'0'),pctIdx,totalIdx,name};
  });

  if(!ds.months.length)ds.months=pctCols.map(i=>({key:String(i),pctIdx:i,totalIdx:-1,name:String(ds.headers[i]||('Month '+(i+1)))}));

}
function txCellPct(ds,row,col){
  const total=ds.totalCol>=0?Math.max(0,txNum(row[ds.totalCol])):0;
  if(total<=0)return 0;
  if(col===ds.cutoffPctCol||col===ds.cutoffCol){
    const entered=ds.cutoffCol>=0?Math.max(0,txNum(row[ds.cutoffCol])):Math.max(0,txNum(row[col]));
    return entered*100/total;
  }
  const month=(ds.months||[]).find(m=>m.pctIdx===col);
  if(month&&month.totalIdx>=0)return Math.max(0,txNum(row[month.totalIdx]))*100/total;
  return txPct(row[col]);
}
function txTotalPct(ds,rows,col){
  const total=ds.totalCol>=0?rows.reduce((a,r)=>a+Math.max(0,txNum(r[ds.totalCol])),0):0;
  if(total<=0)return 0;
  if(col===ds.cutoffPctCol||col===ds.cutoffCol){
    const entered=ds.cutoffCol>=0?rows.reduce((a,r)=>a+Math.max(0,txNum(r[ds.cutoffCol])),0):0;
    return entered*100/total;
  }
  const month=(ds.months||[]).find(m=>m.pctIdx===col);
  if(month&&month.totalIdx>=0)return rows.reduce((a,r)=>a+Math.max(0,txNum(r[month.totalIdx])),0)*100/total;
  const vals=rows.map(r=>txNum(r[col])).filter(Number.isFinite);
  return vals.length?vals.reduce((a,v)=>a+v,0)/vals.length:0;
}

function txSyncTableWidths(){
  const area=document.getElementById('txTableArea'); if(!area)return;
  const head=area.querySelector('.tx-fixed-head-table');
  const body=area.querySelector('.tx-body-table');
  const headWrap=area.querySelector('.tx-fixed-head-wrap');
  const bodyWrap=area.querySelector('.tx-body-wrap');
  if(!head||!body||!headWrap||!bodyWrap)return;

  const mobileTablet=window.matchMedia('(max-width:800px)').matches;
  const minTableWidth=mobileTablet?980:0;
  const available=Math.max(1,bodyWrap.clientWidth);
  const tableWidth=mobileTablet?Math.max(available,minTableWidth):available;

  /* Reset every render so CLF/VO/SHG cannot inherit previous geometry. */
  [head,body].forEach(table=>{
    table.style.width=tableWidth+'px';
    table.style.minWidth=mobileTablet?minTableWidth+'px':'0';
    table.style.maxWidth='none';
    table.style.tableLayout='fixed';
    table.querySelectorAll('th,td').forEach(c=>{
      c.style.width='';
      c.style.minWidth='0';
      c.style.maxWidth='none';
    });
    const old=table.querySelector('colgroup[data-tx-sync]');
    if(old)old.remove();
  });

  const hcells=Array.from(head.querySelectorAll('thead th'));
  if(!hcells.length)return;

  /* One shared colgroup is the source of truth for both separated tables. */
  const weights=hcells.map((th)=>{
    const c=th.className||'';
    if(/tx-pct-head/.test(c))return 8.5;
    if(/tx-conn-head/.test(c))return 10;
    if(/tx-district-head/.test(c))return 10;
    if(/tx-block-head/.test(c))return 13;
    if(/tx-financial-head/.test(c))return 11;
    if(/tx-cutoff-head/.test(c))return 9;
    if(/tx-figure-head/.test(c))return 7;
    return 100;
  });
  const special=weights.reduce((a,w)=>a+(w===100?0:w),0);
  const remaining=weights.filter(w=>w===100).length;
  const fallback=remaining?Math.max(5,(100-special)/remaining):0;
  const finalWeights=weights.map(w=>w===100?fallback:w);
  const total=finalWeights.reduce((a,b)=>a+b,0);
  const normalized=finalWeights.map(w=>w*100/total);

  [head,body].forEach(table=>{
    const cg=document.createElement('colgroup');
    cg.setAttribute('data-tx-sync','1');
    normalized.forEach(w=>{
      const col=document.createElement('col');
      col.style.width=w.toFixed(4)+'%';
      cg.appendChild(col);
    });
    table.insertBefore(cg,table.firstChild);
  });

  headWrap.style.width='100%';
  headWrap.style.maxWidth='100%';
  bodyWrap.style.width='100%';
  bodyWrap.style.maxWidth='100%';
  headWrap.style.overflowX='auto';
  bodyWrap.style.overflowX='auto';
  if(mobileTablet){
    headWrap.style.overflowY='hidden';
    headWrap.style.scrollbarWidth='none';
  }
  /* Re-apply scroll position after geometry changes. */
  if(Math.abs(headWrap.scrollLeft-bodyWrap.scrollLeft)>1){
    headWrap.scrollLeft=bodyWrap.scrollLeft;
  }
}


function txBindTableScroll(){
  const area=document.getElementById('txTableArea');if(!area)return;
  const headWrap=area.querySelector('.tx-fixed-head-wrap'),bodyWrap=area.querySelector('.tx-body-wrap');
  if(!headWrap||!bodyWrap)return;
  if(bodyWrap.dataset.syncBound==='1')return;
  bodyWrap.dataset.syncBound='1';
  let syncing=false;
  const sync=(source,target)=>{
    if(syncing)return;
    syncing=true;
    target.scrollLeft=source.scrollLeft;
    requestAnimationFrame(()=>{syncing=false;});
  };
  bodyWrap.addEventListener('scroll',()=>sync(bodyWrap,headWrap),{passive:true});
  headWrap.addEventListener('scroll',()=>sync(headWrap,bodyWrap),{passive:true});
  window.addEventListener('resize',()=>requestAnimationFrame(txSyncTableWidths),{passive:true});
  requestAnimationFrame(txSyncTableWidths);
}
