<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHE-LEAPS [Farm Livelihoods | Non Farm- Livelihoods]</title>
<style>
:root {
  --navy:#071b3a; --navy2:#0c2d5b; --blue:#174a88; --line:#d7e0ec;
  --bg:#f4f7fb; --text:#142238; --muted:#6b7a90; --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:22px clamp(16px,3vw,42px);display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px #06152b35}
.brand{position:relative;display:flex;align-items:center;gap:14px;z-index:1}.brand-logo{width:62px;height:62px;object-fit:contain;border-radius:14px;background:#fff;padding:4px;box-shadow:0 4px 12px #0002}.brand h1{position:relative}header:before,header:after{content:"";position:absolute;border:1px solid #ffffff18;border-radius:50%;pointer-events:none}header:before{width:280px;height:280px;right:-100px;top:-180px}header:after{width:180px;height:180px;right:120px;bottom:-150px}h1{position:relative;font-size:clamp(20px,3vw,30px);letter-spacing:.5px;margin:0;font-weight:800}
.header-meta{font-size:12px;opacity:.75;text-align:right}
main{max-width:1700px;margin:auto;padding:22px clamp(12px,2.5vw,36px)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{border:1px solid #cbd7e7;background:white;color:var(--navy);border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer;transition:.2s}
.tab:hover,.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;background:linear-gradient(135deg,#ffffff,#f1f6ff);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 3px 14px #13294b0b}
.page-title{font-size:23px;font-weight:800;color:var(--navy)}
select,input{border:1px solid #cbd7e7;border-radius:8px;padding:10px 12px;background:#fff;color:var(--text)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 2px 8px #13294b0b}
.card .label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.card .value{font-size:28px;font-weight:850;color:var(--navy);margin-top:6px}.card.kpi .value{display:inline-block;padding:5px 10px;border-radius:9px}.card.kpi.p90 .value{background:#d8f3df;color:#087f23}.card.kpi.p80 .value{background:#d9f0df;color:#27863d}.card.kpi.p60 .value{background:#fff0c7;color:#9a6b00}.card.kpi.p50 .value{background:#fff4b8;color:#8b7200}.card.kpi.p30 .value{background:#ffe0bd;color:#b34e00}.card.kpi.p0 .value{background:#ffd9d6;color:#b42318}
.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #13294b0b}
.table-wrap{overflow:auto;max-height:65vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:13px}
th{position:sticky;top:0;background:var(--navy2);color:white;padding:13px 12px;text-align:center;white-space:nowrap;cursor:pointer;z-index:3;border-right:1px solid #ffffff32}
th:first-child{border-left:0}
td{text-align:center;padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child{text-align:center}td:nth-child(2){text-align:left}tbody tr:nth-child(even){background:#f8faff}
tbody tr:hover{background:#edf4ff}
th .sort{opacity:.65;margin-left:6px}
.num{text-align:center;font-variant-numeric:tabular-nums}
.percent-cell{font-weight:800;border-radius:6px;padding:5px 8px;display:inline-block;min-width:65px;text-align:center}
.p90{background:#d8f3df;color:#087f23} .p80{background:#d9f0df;color:#27863d}
.p60{background:#fff0c7;color:#9a6b00} .p50{background:#fff4b8;color:#8b7200}
.p30{background:#ffe0bd;color:#b34e00} .p0{background:#ffd9d6;color:#b42318}
.footer{font-size:12px;color:var(--muted);padding:13px 0}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:1024px){
  header{padding:18px clamp(14px,3vw,28px)}
  main{padding:18px clamp(12px,2.5vw,24px)}
  .tabs{gap:7px}
  .tab{padding:10px 12px}
  .toolbar{align-items:stretch}
  .toolbar > *{min-width:0}
  .table-wrap{max-height:68vh;-webkit-overflow-scrolling:touch}
  table{min-width:820px}
}
@media (max-width:650px){
  header{padding:14px 12px;position:sticky}
  .brand{gap:10px;align-items:center;min-width:0}
  .brand-logo{width:44px;height:44px;border-radius:10px}
  h1{font-size:clamp(15px,4.5vw,20px);line-height:1.25;letter-spacing:0}
  .header-meta{display:none}
  main{padding:12px 8px}
  .tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:12px}
  .tab{width:100%;padding:10px 7px;font-size:11px;border-radius:8px;white-space:normal;line-height:1.2}
  .toolbar{display:flex;flex-direction:column;gap:9px;padding:11px;margin-bottom:12px}
  .toolbar > *{width:100%}
  .page-title{font-size:18px;line-height:1.3}
  select,input{width:100%;min-height:42px;font-size:14px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .card{padding:12px 10px;border-radius:10px}
  .card .label{font-size:10px;letter-spacing:.35px}
  .card .value{font-size:23px}
  .panel{border-radius:10px}
  .panel .page-title{padding:14px 12px 10px !important}
  .table-wrap{max-height:none;overflow-x:auto;overflow-y:visible}
  table{min-width:760px;font-size:12px}
  th{padding:11px 9px}
  td{padding:10px 9px}
  .footer{font-size:11px}
}
@media (max-width:380px){
  .tabs{grid-template-columns:1fr}
  h1{font-size:15px}
  .cards{grid-template-columns:1fr 1fr}
  .card .value{font-size:20px}
}
</style>
</head>
