<!DOCTYPE html>

<title>MzSRLM | Financial Inclusion Dashboard</title>
<style>

*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}

.header{position:sticky;top:0;z-index:50;background:var(--navy);color:white;padding:14px 20px;box-shadow:0 4px 18px rgba(0,0,0,.16)}
.header-row{max-width:1600px;margin:auto;display:flex;align-items:center;gap:16px}.brand{flex:1}.brand h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.2px}.brand p{margin:4px 0 0;font-size:12px;opacity:.82}
.actions{display:flex;gap:8px}.icon-btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);color:white;border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:700}
.tabs-wrap{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:40}.tabs{max-width:1600px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:8px 20px}.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:10px 17px;border-radius:9px;font-weight:750;cursor:pointer}.tab:hover{background:var(--hover);color:var(--navy)}.tab.active{background:var(--navy);color:#fff}
.main{width:100%;max-width:1600px;margin:auto;padding:18px 20px 40px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px}
.search{flex:1;min-width:230px;position:relative}.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:none}.search span{position:absolute;left:13px;top:9px}
select,.control-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px}.control-btn{cursor:pointer;font-weight:700}.control-btn:hover{background:var(--hover)}.control-btn:disabled{opacity:.5;cursor:wait}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:15px}.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;box-shadow:var(--shadow);min-width:0;transition:.2s}.kpi:hover{transform:translateY(-2px)}.kpi .label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.35px;line-height:1.35;min-height:30px}.kpi .value{font-size:25px;font-weight:900;margin-top:5px;color:var(--navy);overflow-wrap:anywhere}.dark .kpi .value{color:#72a9ff}.sub{font-size:11px;color:var(--muted);margin-top:4px}
.metric-panel,.table-card{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:15px;overflow:hidden;box-shadow:var(--shadow)}
.metric-head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800}.metric-head small{display:block;color:var(--muted);margin-top:3px;font-weight:500}.metric-body{display:block!important;padding:16px;visibility:visible!important}.metric-panel .metric-head{cursor:default}.metric-panel .metric-body[hidden]{display:block!important}.metric-panel details>summary{display:none}.metric-panel details[open]>.metric-body{display:block}.metric-panel details>.metric-body{display:block!important}.metric-chart{display:flex;align-items:flex-end;gap:12px;min-height:260px;overflow-x:auto;padding:12px 8px}.metric-col{flex:0 0 70px;height:225px;display:grid;grid-template-rows:25px 160px 40px;align-items:end;text-align:center}.metric-col-value{font-size:11px;font-weight:900}.metric-col-track{height:160px;display:flex;align-items:flex-end;justify-content:center}.metric-col-fill{width:32px;min-height:4px;border-radius:7px 7px 2px 2px}.metric-col-label{font-size:10px;line-height:1.2;color:var(--muted);overflow-wrap:anywhere}
.table-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}.table-title{font-weight:850}.count{font-size:12px;color:var(--muted)}.table-scroll{overflow:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;table-layout:auto}thead th{position:sticky;top:0;background:var(--navy);color:#fff;padding:12px 10px;font-size:12px;line-height:1.35;text-align:center;white-space:normal;cursor:pointer;z-index:5}thead tr.group-row th{position:sticky;top:0;z-index:9;cursor:default;font-size:13px;padding:11px 8px}thead tr.sub-row th{position:sticky;top:42px;z-index:8}thead tr.group-row th[rowspan='2']{vertical-align:middle}thead th:first-child{left:0;z-index:11}thead th.group-fresh{background:#176B55;color:#fff}thead th.group-renewal{background:#A85B12;color:#fff}thead th.group-total{background:#344B70;color:#fff}thead tr.sub-row th.fresh-col{background:#DDF2E9;color:#174C3C}thead tr.sub-row th.renewal-col{background:#FCE9D5;color:#75400D}thead tr.sub-row th.total-col{background:#E2EAF5;color:#263E61}.dark thead tr.sub-row th.fresh-col{background:#174B3C;color:#DDF2E9}.dark thead tr.sub-row th.renewal-col{background:#633A16;color:#FCE9D5}.dark thead tr.sub-row th.total-col{background:#263E61;color:#E2EAF5}
tbody td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.35;text-align:center;vertical-align:middle;white-space:normal}tbody tr:nth-child(even){background:rgba(127,145,170,.045)}tbody tr:hover{background:var(--hover)}td.left{text-align:left}td.amount{text-align:right;font-variant-numeric:tabular-nums}.total-row td{font-weight:900;background:var(--hover);border-top:2px solid var(--navy)}.total-row:hover td{background:var(--hover)}
.empty{padding:40px;text-align:center;color:var(--muted)}.footer{max-width:1600px;margin:auto;padding:0 20px 22px;text-align:right;color:var(--muted);font-size:11px}

@media(max-width:820px){.header-row{flex-wrap:wrap}.tabs-wrap{top:64px}.main{padding:12px}.tabs{padding:7px 12px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.kpis,.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}.table-scroll{max-height:62vh}}

<body>
<header class="header"><div class="header-row"><div class="brand"><h1 id="pageTitle">Financial Inclusion</h1><p id="subtitle">MzSRLM · Data as on 31 October 2026</p></div><div class="actions"><button class="icon-btn" id="themeBtn" title="Switch theme">☾</button><button class="icon-btn" id="fullscreenBtn" title="Fullscreen">⛶</button></div></div></header>

<script>
const DATA = {"bank": {"headers": ["S/N", "Block", "Fresh Target", "Fresh Submission (CM)", "Fresh Submission (Cumulative)", "Fresh Achievement (CM)", "Fresh Achievement (Cumulative)", "Fresh Amount (₹ Lakhs)", "Renewal Target", "Renewal Submission (CM)", "Renewal Submission (Cumulative)", "Renewal Achievement (CM)", "Renewal Achievement (Cumulative)", "Renewal Amount (₹ Lakhs)", "Total Achievement", "Total Amount (₹ Lakhs)", "Pending"], "rows": [[1, "East Lungdar", 68, 2, 5, 2, 5, 8.5, 51, 0, 12, 0, 12, 87, 17, 95.5, null], [2, "Serchhip", 98, 3, 7, 2, 6, 8, 48, 7, 18, 2, 15, 108, 21, 116, 6], [3, "Thingdawl", 76, 1, 2, 0, 0, 3, 47, 5, 5, 1, 1, 2, 1, 5, 6], [4, "Bilkhawthlir", 84, 0, 2, 0, 5, 6.5, 57, 0, 19, 1, 18, 90, 23, 96.5, 9], [5, "Zawlnuam", 69, 2, 10, 0, 7, 12, 21, 3, 15, 0, 12, 72, 19, 84, 5], [6, "Kawrtethawveng", 65, 2, 2, 0, 0, null, 45, 5, 9, 0, 3, 26, 3, 26, 7], [7, "West Phaileng", 68, 1, 5, 0, 3, 4.5, 35, 4, 16, 1, 12, 40, 15, 44.5, 4], [8, "Reiek", 75, 2, 11, 2, 7, 11, 40, 14, 36, 4, 16, 70.4, 23, 81.4, 14], [9, "Champhai", 108, 0, 2, 1, 1, 1.5, 81, 4, 36, 3, 16, 110, 17, 111.5, 13], [10, "Khawbung", 78, 0, 4, 1, 3, 5, 39, 4, 23, 4, 15, 118, 18, 123, 13], [11, "Siaha", 122, 0, 0, 0, 0, 0, 80, 1, 12, 1, 12, 61, 12, 61, 24], [12, "Tipa", 70, 0, 20, 3, 17, 25.5, 30, 0, 22, 2, 18, 74, 35, 99.5, 0], [13, "Sangau", 70, null, null, null, null, null, 40, null, null, null, null, null, 0, 0, null], [14, "Lawngtlai", 129, 2, 11, 1, 2, 3, 35, 1, 9, 1, 7, 29, 9, 32, 4], [15, "Bungtlang South", 68, 0, 0, 0, 0, 0, 30, 6, 6, 0, 2, 10, 2, 10, 6], [16, "Chawngte", 135, 0, 13, 2, 5, 7.5, 65, 2, 15, 0, 0, 28, 5, 35.5, 18], [17, "Phullen", 81, 1, 6, 1, 7, 14, 40, 2, 9, 2, 9, 34, 16, 48, 4], [18, "Ngopa", 107, 0, 7, 3, 8, 14, 77, 5, 15, 1, 14, 95.5, 22, 109.5, 6], [19, "Tlangnuam", 85, 2, 15, 1, 13, 19.5, 30, 1, 4, null, 3, 13, 16, 32.5, 2], [20, "Aibawk", 73, 6, 19, 0, 13, 49, 45, 9, 14, 0, 5, 27, 18, 76, 15], [21, "Thingsulthliah", 71, 0, 3, 0, 3, 4.5, 28, 1, 5, 1, 6, 28, 9, 32.5, 0], [22, "Darlawn", 67, 5, 19, 0, 14, 21, 50, 18, 49, 6, 37, 115.5, 51, 136.5, 17], [23, "Bunghmun", 65, 0, 1, 0, 1, 3, 25, 3, 3, 3, 1, 11, 2, 14, 2], [24, "Lungsen", 79, 0, 2, 0, 2, 3, 5, 0, 0, 0, 0, 0, 2, 3, null], [25, "Lunglei", 69, 1, 15, 0, 14, 21, 25, 3, 10, 2, 9, 33, 23, 54, 2], [26, "Tlabung", 105, 5, 13, 4, 13, 19.5, 10, 1, 3, 1, 3, 9, 16, 28.5, null], [27, "Khawzawl", 93, 1, 3, 0, 3, 5.5, 71, 5, 17, 11, 23, 67.7, 26, 73.2, 4], [28, "Hnahthial", 74, 2, 13, 3, 8, 12, 32, 3, 4, 0, 4, 23.5, 12, 35.5, 5]], "total": ["", "TOTAL", 2352, 38, 210, 26, 160, 282, 1182, 107, 386, 47, 273, 1382.6000000000001, 433, 1664.6000000000001, 186]}, "enterprise": {"headers": ["S/N", "Block", "Mudra/Bank Loan Product – No.", "Amount"], "rows": [[1, "Champhai", 0, 0], [2, "Lawngtlai", 0, 0], [3, "Sangau", null, null], [4, "Reiek", null, null], [5, "Chawngte", null, null], [6, "Tipa", null, null], [7, "Ngopa", 2, 1.9], [8, "Bungtlang South", null, null], [9, "West Phaileng", 0, 0], [10, "Zawlnuam", 7, 33], [11, "Bilkhawthlir", null, null], [12, "Thingdawl", 1, 5], [13, "East Lungdar", 1, 3], [14, "Khawbung", null, null], [15, "Serchhip", null, null], [16, "Siaha", null, null], [17, "Khawzawl", 1, 5], [18, "Phullen", 0, 0], [19, "Thingsulthliah", null, null], [20, "Bunghmun", null, null], [21, "Darlawn", 1, 5], [22, "Lungsen", null, null], [23, "Tlangnuam", 8, 9], [24, "Hnahthial", 1, 5], [25, "Aibawk", 1, 5], [26, "Lunglei", 1, 1], [27, "Tlabung", null, null], [28, "Kawrtethawveng", 0, 0]], "total": ["", "TOTAL", 24, 72.9]}};
const TABS=[{id:"bank",name:"SHG Bank Linkage"},{id:"enterprise",name:"Enterprise Financing"}];
let active="bank", filtered=[], sort={index:-1,dir:1};
const $=id=>document.getElementById(id);
const fmt=(v,d=0)=>{if(v===null||v===""||v===undefined)return "—";let n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d}):String(v)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===null||v===""||v===undefined)return null;let n=Number(String(v).replace(/,/g,""));return Number.isFinite(n)?n:null};
const current=()=>DATA[active];
function renderTabs(){$("tabs").innerHTML=TABS.map(t=>`<button class="tab ${t.id===active?"active":""}" data-tab="${t.id}">${t.name}</button>`).join("");}
function switchTab(id){active=id;sort={index:-1,dir:1};$("searchBox").value="";$("blockFilter").value="";$("districtFilter").value="";$("districtFilter").disabled=true;$("pageTitle").textContent="Financial Inclusion";$("subtitle").textContent=active==="bank"?"SHG Bank Linkage · Data as on 31 October 2026":"";$("tableTitle").textContent=active==="bank"?"Block-wise Achievement on SHG Bank Linkage":"Enterprise Financing – Mudra/Bank Loan Product";renderTabs();populateBlocks();applyFilters();}
function populateBlocks(){let blocks=current().rows.map(r=>r[1]).filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b)));$("blockFilter").innerHTML='<option value="">All Blocks</option>'+blocks.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join("");}
function applyFilters(){let q=$("searchBox").value.toLowerCase().trim(),b=$("blockFilter").value;filtered=current().rows.filter(r=>(!b||String(r[1])===b)&&(!q||r.map(x=>String(x??"")).join(" ").toLowerCase().includes(q)));if(sort.index>=0)filtered.sort((a,b)=>{let x=num(a[sort.index]),y=num(b[sort.index]);return x!==null&&y!==null?(x-y)*sort.dir:String(a[sort.index]??"").localeCompare(String(b[sort.index]??""),undefined,{numeric:true})*sort.dir});renderKpis();renderTable();}
function sumCol(rows,i){return rows.reduce((s,r)=>s+(num(r[i])??0),0);}
function renderKpis(){let rows=filtered, cards=[];
 if(active==="bank"){
  let freshTarget=sumCol(rows,2),renewTarget=sumCol(rows,8),freshSub=sumCol(rows,4),renewSub=sumCol(rows,10),freshAch=sumCol(rows,6),renewAch=sumCol(rows,12),totalAch=sumCol(rows,14),totalAmount=sumCol(rows,15),pending=sumCol(rows,16);
  let target=freshTarget+renewTarget;
  cards=[["TOTAL TARGET",fmt(target),"Fresh + Renewal"],["CUMULATIVE SUBMISSIONS",fmt(freshSub+renewSub),"Fresh + Renewal"],["TOTAL ACHIEVEMENT",fmt(totalAch),"As reported in source sheet"],["TOTAL AMOUNT", "₹"+fmt(totalAmount,2)+" lakh","Cumulative amount"],["ACHIEVEMENT RATE",target?fmt(totalAch/target*100,2)+"%":"—","Total achievement ÷ total target"],["PENDING",fmt(pending),"As reported in source sheet"]];
  $("kpis").classList.add("six");
 }else{
  let count=sumCol(rows,2),amount=sumCol(rows,3);
  cards=[["TOTAL PRODUCTS",fmt(count),"Mudra/Bank Loan Product"],["TOTAL AMOUNT", "₹"+fmt(amount,2),"Amount as shown in workbook"],["BLOCKS WITH ENTRY",fmt(rows.filter(r=>num(r[2])!==null&&num(r[2])!==0).length),"Blocks with non-zero product count"],["BLOCKS LISTED",fmt(rows.length),"All listed blocks"]];
  $("kpis").classList.remove("six");
 }
 $("kpis").innerHTML=cards.map(c=>`<div class="kpi"><div class="label">${esc(c[0])}</div><div class="value">${esc(c[1])}</div><div class="sub">${esc(c[2])}</div></div>`).join("");
}
function pctColor(n){return n>=90?"#087F23":n>=80?"#4CAF50":n>=60?"#D99F25":n>=50?"#F2C94C":n>=30?"#EF6C00":"#D93025";}
function renderChart(){let chart=$("metricChart");if(active!=="bank"){chart.innerHTML='<div class="empty">No achievement percentage is provided in the Enterprise Financing workbook.</div>';return;}
 let arr=filtered.map(r=>({name:r[1],v:num(r[14])})).filter(x=>x.v!==null);let max=Math.max(1,...arr.map(x=>x.v));
 chart.innerHTML=arr.map(x=>`<div class="metric-col"><div class="metric-col-value">${fmt(x.v)}</div><div class="metric-col-track"><div class="metric-col-fill" style="height:${Math.max(3,x.v/max*100)}%;background:${pctColor(x.v)}"></div></div><div class="metric-col-label">${esc(x.name)}</div></div>`).join("")||'<div class="empty">No achievement data for this selection.</div>';
}
function display(v,i){if(v===null||v===undefined||v==="")return "—";if(active==="bank"&&[7,13,15].includes(i))return fmt(v,2);if(active==="enterprise"&&i===3)return fmt(v,2);return typeof v==="number"?fmt(v):String(v);}
function renderTable(){let d=current(),headers=d.headers;let total=d.total;let rows=filtered;
 $("rowCount").textContent=`${rows.length} of ${d.rows.length} blocks`;
 let head="";
 if(active==="bank"){
  head='<tr class="group-row"><th rowspan="2" data-sort="0">S/N</th><th rowspan="2" data-sort="1">Block</th><th colspan="6" class="group-fresh">FRESH</th><th colspan="6" class="group-renewal">RENEWAL</th><th colspan="3" class="group-total">OVERALL</th></tr><tr class="sub-row">'+headers.slice(2).map((h,j)=>{let i=j+2,cls=i<=7?'fresh-col':i<=13?'renewal-col':'total-col';return `<th class="${cls}" data-sort="${i}">${esc(h.replace(/^Fresh /,'').replace(/^Renewal /,''))}${sort.index===i?(sort.dir===1?' ↑':' ↓'):''}</th>`}).join('')+'</tr>';
 }else{
  head='<tr>'+headers.map((h,i)=>`<th data-sort="${i}">${esc(h)}${sort.index===i?(sort.dir===1?' ↑':' ↓'):''}</th>`).join('')+'</tr>';
 }
 let html="<table><thead>"+head+"</thead><tbody>";
 rows.forEach(r=>{html+="<tr>"+headers.map((h,i)=>`<td class="${i===1?"left":([7,13,15,3].includes(i)?"amount":"")}">${esc(display(r[i],i))}</td>`).join("")+"</tr>";});
 html+="</tbody><tfoot><tr class='total-row'>"+headers.map((h,i)=>`<td>${i===0?"":esc(display(total[i],i))}</td>`).join("")+"</tr></tfoot></table>";
 $("tableWrap").innerHTML=html;
}
$("tabs").addEventListener("click",e=>{let b=e.target.closest("[data-tab]");if(b)switchTab(b.dataset.tab)});
$("searchBox").addEventListener("input",applyFilters);$("blockFilter").addEventListener("change",applyFilters);
$("resetBtn").addEventListener("click",()=>{$("searchBox").value="";$("blockFilter").value="";sort={index:-1,dir:1};applyFilters();});
$("tableWrap").addEventListener("click",e=>{let th=e.target.closest("[data-sort]");if(!th)return;let i=Number(th.dataset.sort);if(sort.index===i)sort.dir*=-1;else sort={index:i,dir:1};applyFilters();});
$("themeBtn").addEventListener("click",()=>{document.body.classList.toggle("dark");$("themeBtn").textContent=document.body.classList.contains("dark")?"☀":"☾";});
$("fullscreenBtn").addEventListener("click",()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();});
$("excelBtn").addEventListener("click",()=>{let d=current(),rows=filtered;if(!window.XLSX){alert("Excel export library could not be loaded. Please check your internet connection.");return;}let ws=XLSX.utils.aoa_to_sheet([d.headers,...rows,d.total]);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,active==="bank"?"SHG Bank Linkage":"Enterprise Financing");XLSX.writeFile(wb,(active==="bank"?"SHG_Bank_Linkage":"Enterprise_Financing")+"_filtered.xlsx");});
$("imageBtn").addEventListener("click",async()=>{if(!window.html2canvas){alert("Image export requires an internet connection to load the capture library.");return;}let btn=$("imageBtn");btn.disabled=true;try{let c=await html2canvas($(".main"),{scale:2,backgroundColor:getComputedStyle(document.body).getPropertyValue("--bg").trim()});let a=document.createElement("a");a.download=(active==="bank"?"SHG_Bank_Linkage":"Enterprise_Financing")+"_Dashboard.png";a.href=c.toDataURL("image/png");a.click();}catch(e){alert("Unable to save image. Please try again.");}finally{btn.disabled=false;}});
renderTabs();populateBlocks();applyFilters();
</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body></html>
