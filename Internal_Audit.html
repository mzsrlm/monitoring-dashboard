<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Audit Dashboard</title>
<style>
:root{
 --bg:#f4f7fb;--surface:#fff;--text:#172033;--muted:#68758a;--border:#dce4ef;
 --primary:#163b70;--primary2:#245a9b;--good:#146c35;--mid:#a66b00;--low:#b42318;
 --shadow:0 5px 22px rgba(23,48,87,.08);
}
[data-theme="dark"]{
 --bg:#07162e;--surface:#0d2343;--text:#edf5ff;--muted:#a8bdd8;--border:#254263;
 --primary:#8fc7ff;--primary2:#3e91e8;--shadow:0 5px 22px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;font-size:14px}
button,select{font:inherit}
.app{max-width:1700px;margin:auto;padding:18px}
.header{position:sticky;top:0;z-index:10;background:var(--bg);padding-bottom:14px}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(20px,2.6vw,32px);margin:0;color:var(--primary)}
.subtitle{color:var(--muted);margin:5px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer}
.btn.primary{background:var(--primary2);color:white;border-color:var(--primary2)}
.filters{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-top:15px}
.filter label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;text-transform:uppercase}
select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.kpi{background:rgba(255,255,255,.96);color:#172033;border:1px solid #e5e9f0;border-radius:12px;padding:14px 16px;box-shadow:0 4px 16px rgba(23,48,87,.06);border-top:3px solid #e5e9f0}
.kpi .value{font-size:clamp(30px,3.2vw,42px);font-weight:900;line-height:1.05;margin-top:7px;letter-spacing:-1.5px}
.kpi .value .badge{background:transparent!important;padding:0;border-radius:0;font-size:inherit;font-weight:inherit}
.kpi .value{color:#172033}.kpi .value .badge.excellent{color:#075e2b}.kpi .value .badge.high{color:#198754}.kpi .value .badge.good{color:#9a6700}.kpi .value .badge.medium{color:#c08a00}.kpi .value .badge.attention{color:#e07800}.kpi .value .badge.low{color:#c6283d}
.kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.kpi .detail{font-size:11px;color:var(--muted);margin-top:3px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:13px 15px;border-bottom:1px solid var(--border)}
.panel-head h2{font-size:15px;margin:0}
.meta{font-size:11px;color:var(--muted)}
.table-wrap{max-height:62vh;overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1000px}
th,td{padding:10px 11px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
th{position:sticky;top:0;z-index:3;background:var(--primary);color:white;font-size:11px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
th:last-child,td:last-child{border-right:0}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--primary2) 4%,var(--surface))}
tbody tr:hover{background:color-mix(in srgb,var(--primary2) 10%,var(--surface))}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800}
.excellent{background:#c8f2d8;color:#075e2b}.high{background:#d9f5e5;color:#126b3c}.good{background:#e5f4d8;color:#3f7d27}.medium{background:#fff0cc;color:#8a5b00}.attention{background:#fff7cc;color:#927000}.low{background:#ffe0e4;color:#a32235}
[data-theme="dark"] .excellent{background:#123f2b;color:#8cf0b6}
[data-theme="dark"] .high{background:#123f2b;color:#8cf0b6}
[data-theme="dark"] .good{background:#24451d;color:#b7f29a}
[data-theme="dark"] .medium{background:#4b3812;color:#ffd67b}
[data-theme="dark"] .attention{background:#514612;color:#ffe98a}
[data-theme="dark"] .low{background:#4d1d28;color:#ff9cac}
.footer{color:var(--muted);font-size:11px;text-align:right;margin-top:10px}
.empty{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.app{padding:10px}.filters,.kpis{grid-template-columns:1fr}.header-top{align-items:flex-start}.actions{width:100%}.btn{flex:1}}
</style>

<script id="global-theme-listener">
(function () {
  function applyGlobalTheme(theme) {
    if (theme !== "dark" && theme !== "light") return;
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("global-dashboard-theme", theme); } catch (e) {}
  }

  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "theme-change") {
      applyGlobalTheme(event.data.theme);
    }
  });

  try {
    var savedTheme = localStorage.getItem("global-dashboard-theme");
    if (savedTheme === "dark" || savedTheme === "light") {
      applyGlobalTheme(savedTheme);
    }
  } catch (e) {}
})();
</script>

</head>
<body>
<div class="app">
<header class="header">
 <div class="header-top">
  <div>
</div>
  <div class="actions">
   <button class="btn" id="themeBtn">☾ Dark Mode</button>
   <button class="btn" id="resetBtn">Reset Filters</button>
   <button class="btn primary" id="exportBtn">Export CSV</button>
  </div>
 </div>
 <div class="filters">
  <div class="filter"><label>District</label><select id="district"></select></div>
  <div class="filter"><label>Block</label><select id="block"></select></div>
  <div class="filter"><label>Financial Year</label><select id="fy"></select></div>
  <div class="filter"><label>Audit Period</label><select id="period"></select></div>
 </div>
</header>

<section class="kpis" id="kpis"></section>

<section class="panel">

  <h2>Audit Achievement Details</h2>
  <div class="meta" id="rowMeta"></div>
 </div>
 <div class="table-wrap">
  <table id="auditTable">
   <thead><tr>

    <th data-key="auditPeriod">Audit Period ↕</th>
    <th data-key="block">Block ↕</th>

    <th data-key="totalVOs" class="num">Total VOs ↕</th>
    <th data-key="auditedVOs" class="num">Audited VOs ↕</th>
    <th data-key="voPct" class="num">VO % ↕</th>
    <th data-key="totalSHGs" class="num">Total SHGs ↕</th>
    <th data-key="auditedSHGs" class="num">Audited SHGs ↕</th>
    <th data-key="shgPct" class="num">SHG % ↕</th>
    <th data-key="overallPct" class="num">Overall % ↕</th>
   </tr></thead>
   <tbody id="tableBody"></tbody>
  </table>
 </div>
</section>
<div class="footer" id="lastUpdated"></div>
</div>
