<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061b43">
<title>MzSRLM Dashboard Loading</title>
<style>
:root{--navy:#041536;--navy2:#082b60;--cyan:#66e5ff;--white:#f5f9ff;--muted:#b5c9e6}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;overflow:hidden;display:grid;place-items:center;font-family:"Segoe UI",Arial,sans-serif;color:var(--white);background:radial-gradient(circle at 50% 22%,rgba(28,132,255,.28),transparent 29%),linear-gradient(135deg,var(--navy),var(--navy2) 55%,#03132e)}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.background:before{content:"";position:absolute;inset:0;opacity:.11;background-image:linear-gradient(rgba(125,190,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(125,190,255,.25) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent)}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;background:#2d91ff;box-shadow:0 0 15px #2d91ff;animation:float 7s ease-in-out infinite}
.p1{left:13%;top:20%}.p2{left:78%;top:14%;animation-delay:1.5s}.p3{left:86%;top:42%;animation-delay:3s}.p4{left:15%;top:64%;animation-delay:2s}.p5{left:67%;top:76%;animation-delay:4s}
.wave{position:absolute;width:125%;height:26%;left:-12%;bottom:-12%;border-radius:50% 50% 0 0;border-top:1px solid rgba(74,190,255,.85);background:linear-gradient(180deg,rgba(15,100,210,.22),transparent);transform:rotate(-5deg)}
.wave.two{bottom:-18%;transform:rotate(8deg);border-top-color:rgba(60,137,255,.35)}
.container{position:relative;z-index:2;width:min(94%,900px);padding:22px;text-align:center;animation:appear .8s ease both}
.logo{width:clamp(145px,19vw,245px);height:clamp(145px,19vw,245px);object-fit:contain;display:block;margin:0 auto 20px;filter:drop-shadow(0 0 22px rgba(56,185,255,.65));animation:pulse 4s ease-in-out infinite}
.title{font-size:clamp(1.35rem,3.1vw,2.55rem);font-weight:750;line-height:1.2;letter-spacing:-.035em}
.tagline{margin-top:13px;color:var(--muted);font-size:clamp(.68rem,1.5vw,.95rem);letter-spacing:.27em;text-transform:uppercase}
.accent{width:90px;height:3px;margin:23px auto 19px;border-radius:20px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 16px rgba(102,229,255,.8)}
.analytics{width:min(100%,530px);margin:0 auto 20px;padding:15px 18px 12px;border:1px solid rgba(130,196,255,.16);border-radius:15px;background:rgba(3,25,65,.34)}
.analytics-heading{display:flex;justify-content:space-between;margin-bottom:10px;color:#c9ddf5;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.chart{height:82px;display:flex;align-items:end;justify-content:center;gap:9px;padding:4px 8px}
.bar{width:clamp(12px,2.3vw,20px);height:var(--height);border-radius:5px 5px 2px 2px;background:linear-gradient(to top,#0878f6,#65e5ff);box-shadow:0 0 12px rgba(40,180,255,.35);transform-origin:bottom;animation:chartGrow 1.4s ease-in-out infinite alternate;animation-delay:var(--delay)}
.chart-line{height:1px;margin-top:5px;background:linear-gradient(90deg,transparent,rgba(111,213,255,.45),transparent)}
.status{margin:12px 0 15px;color:#dcecff;font-size:clamp(.9rem,1.8vw,1.1rem)}
.status:after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
.progress-row{width:min(100%,530px);display:flex;align-items:center;gap:14px;margin:0 auto}
.track{flex:1;height:9px;overflow:hidden;border-radius:99px;background:rgba(180,215,250,.22)}
.progress{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#0879ff,#35baff,#72edff);box-shadow:0 0 16px rgba(38,185,255,.9)}
.percent{min-width:42px;text-align:left;font-size:.82rem;font-weight:700}
.footer{margin-top:45px;color:#c2d7f0;font-size:clamp(.67rem,1.4vw,.92rem);letter-spacing:.03em}
.footer span{color:var(--cyan);margin:0 10px}
.fade-out{animation:fadeOut .45s ease forwards}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes chartGrow{from{transform:scaleY(.72);opacity:.65}to{transform:scaleY(1);opacity:1}}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
@keyframes float{0%,100%{transform:translate(0,0);opacity:.45}50%{transform:translate(20px,-18px);opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:scale(1.02)}}
@media(max-width:600px){.container{padding:12px}.logo{margin-bottom:17px}.tagline{letter-spacing:.14em;line-height:1.8}.analytics{padding:12px}.chart{gap:5px;height:65px}.footer{margin-top:32px}.footer span{margin:0 5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ==========================================
   RESPONSIVE / 100% ZOOM ADAPTATION
   ========================================== */

html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  width: 100%;
  min-height: 100svh;
  min-height: 100dvh;
  padding:
    max(12px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
}

.container {
  width: min(100%, 900px);
  max-height: 100svh;
  max-height: 100dvh;
  overflow: hidden;
  padding: clamp(12px, 3vw, 28px);
}

.logo {
  width: min(245px, 30vw, 27svh);
  height: min(245px, 30vw, 27svh);
  max-width: 100%;
  margin-bottom: clamp(12px, 2.5vh, 20px);
}

.title {
  max-width: 100%;
  overflow-wrap: anywhere;
  font-size: clamp(1.15rem, 3.1vw, 2.55rem);
}

.tagline {
  max-width: 100%;
  font-size: clamp(.58rem, 1.5vw, .95rem);
  letter-spacing: clamp(.08em, .27em, .27em);
  overflow-wrap: anywhere;
}

.accent {
  margin-top: clamp(14px, 2.5vh, 23px);
  margin-bottom: clamp(12px, 2vh, 19px);
}

.analytics {
  width: min(100%, 530px);
  padding: clamp(9px, 1.8vw, 15px) clamp(10px, 2vw, 18px);
  margin-bottom: clamp(10px, 2vh, 20px);
}

.analytics-heading {
  gap: 8px;
  font-size: clamp(.58rem, 1.3vw, .72rem);
}

.chart {
  height: clamp(48px, 9vh, 82px);
  gap: clamp(3px, 1.2vw, 9px);
  padding: 3px;
}

.bar {
  width: clamp(7px, 2.3vw, 20px);
}

.status {
  margin: clamp(8px, 1.7vh, 12px) 0 clamp(10px, 2vh, 15px);
  font-size: clamp(.78rem, 1.8vw, 1.1rem);
}

.progress-row {
  width: min(100%, 530px);
  gap: clamp(8px, 1.8vw, 14px);
}

.track {
  min-width: 0;
  height: clamp(6px, 1.2vw, 9px);
}

.percent {
  min-width: 38px;
  font-size: clamp(.7rem, 1.5vw, .82rem);
}

.footer {
  margin-top: clamp(22px, 5vh, 45px);
  font-size: clamp(.56rem, 1.4vw, .92rem);
  line-height: 1.6;
  overflow-wrap: anywhere;
}

@media (max-width: 768px) {
  .container {
    width: 100%;
  }

  .logo {
    width: min(205px, 32vw, 24svh);
    height: min(205px, 32vw, 24svh);
  }

  .title {
    font-size: clamp(1.15rem, 4.6vw, 2rem);
  }

  .tagline {
    letter-spacing: .12em;
  }
}

@media (max-width: 480px) {
  .container {
    padding: 10px;
  }

  .logo {
    width: min(165px, 38vw, 22svh);
    height: min(165px, 38vw, 22svh);
  }

  .title {
    font-size: clamp(1rem, 5.2vw, 1.45rem);
  }

  .tagline {
    font-size: clamp(.54rem, 2.3vw, .75rem);
    letter-spacing: .08em;
  }

  .analytics-heading {
    font-size: .58rem;
  }

  .chart {
    height: 52px;
  }

  .footer {
    margin-top: 22px;
    font-size: .56rem;
  }

  .footer span {
    margin: 0 4px;
  }
}

/* Short screens and mobile landscape */
@media (max-height: 650px) {
  .container {
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .logo {
    width: min(125px, 18vw, 20svh);
    height: min(125px, 18vw, 20svh);
    margin-bottom: 8px;
  }

  .tagline {
    margin-top: 6px;
  }

  .accent {
    margin: 10px auto;
  }

  .analytics {
    margin-bottom: 8px;
  }

  .chart {
    height: 42px;
  }

  .footer {
    margin-top: 18px;
  }
}

/* Very narrow devices */
@media (max-width: 350px) {
  .analytics-heading {
    font-size: .52rem;
  }

  .chart {
    gap: 2px;
  }

  .bar {
    width: 6px;
  }

  .footer {
    font-size: .5rem;
  }
}

/* Prevent hover effects from interfering on touch devices */
@media (hover: none) and (pointer: coarse) {
  .bar {
    animation-duration: 1.8s;
  }
}

</style>
</head>

<h1 class="title">Mizoram State Rural Livelihoods Mission</h1>
<p class="tagline">Towards Empowered Rural Communities</p>
<div class="accent"></div>

<section class="analytics" aria-label="Animated dashboard preview">
<div class="analytics-heading"><span>Dashboard analytics</span><span id="analyticsState">Connecting</span></div>
<div class="chart" aria-hidden="true">
<div class="bar" style="--height:32%;--delay:0s"></div>
<div class="bar" style="--height:55%;--delay:.08s"></div>
<div class="bar" style="--height:43%;--delay:.16s"></div>
<div class="bar" style="--height:76%;--delay:.24s"></div>
<div class="bar" style="--height:61%;--delay:.32s"></div>
<div class="bar" style="--height:88%;--delay:.40s"></div>
<div class="bar" style="--height:70%;--delay:.48s"></div>
<div class="bar" style="--height:96%;--delay:.56s"></div>
<div class="bar" style="--height:80%;--delay:.64s"></div>
<div class="bar" style="--height:100%;--delay:.72s"></div>
</div>
<div class="chart-line"></div>
</section>

<div class="status" id="loadingText">Connecting to dashboard</div>
<div class="progress-row">
<div class="track"><div class="progress" id="loadingBar"></div></div>
<div class="percent" id="loadingPercent">0%</div>
</div>

<footer class="footer">Inclusive <span>|</span> Resilient <span>|</span> Prosperous Rural Mizoram</footer>
</main>

<script>
const DASHBOARD_FILE = "dashboard.html";
const LOADING_TIME = 2000;
const FADE_DURATION = 0;

const splashScreen = document.getElementById("splashScreen");
const loadingBar = document.getElementById("loadingBar");
const loadingPercent = document.getElementById("loadingPercent");
const loadingText = document.getElementById("loadingText");
const analyticsState = document.getElementById("analyticsState");

const statuses = [
  {at:0,text:"Connecting to dashboard",state:"Connecting"},
  {at:25,text:"Preparing dashboard modules",state:"Preparing"},
  {at:50,text:"Synchronizing data interface",state:"Syncing"},
  {at:75,text:"Finalizing workspace",state:"Finalizing"},
  {at:100,text:"Dashboard ready",state:"Ready"}
];

let redirecting = false;
let frame = null;
let redirectTimer = null;

function updateProgress(value) {
  const progress = Math.max(0, Math.min(100, value));
  loadingBar.style.width = progress + "%";
  loadingPercent.textContent = progress + "%";

  const current = statuses.reduce(
    (result, item) => progress >= item.at ? item : result,
    statuses[0]
  );

  loadingText.textContent = current.text;
  analyticsState.textContent = current.state;
}

function openDashboard() {
  if (redirecting) return;
  redirecting = true;

  if (frame) cancelAnimationFrame(frame);
  if (redirectTimer) clearTimeout(redirectTimer);

  updateProgress(100);
  splashScreen.classList.add("fade-out");

  redirectTimer = setTimeout(() => {
    window.location.href = DASHBOARD_FILE;
  }, FADE_DURATION);
}

function startLoading() {
  const start = performance.now();

  function animate(now) {
    const elapsed = now - start;
    const progress = Math.min(100, Math.round((elapsed / LOADING_TIME) * 100));
    updateProgress(progress);

    if (progress < 100) {
      frame = requestAnimationFrame(animate);
    } else {
      openDashboard();
    }
  }

  frame = requestAnimationFrame(animate);
}

startLoading();
</script>
</body>
