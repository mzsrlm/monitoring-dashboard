<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPRP Dashboard | Mizoram</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--bg:#f3f6fb;--surface:#fff;--ink:#334155;--muted:#64748b;--line:#e2e8f0;--primary:#1e3a8a;--accent:#0f766e;--shadow:0 10px 28px rgba(15,23,42,.07)}
body.dark{--bg:#071a36;--surface:#0d2a52;--ink:#f1f5f9;--muted:#cbd5e1;--line:#24466f;--primary:#3b82f6;--accent:#14b8a6}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}.app{max-width:1600px;margin:auto;padding:22px}
.hero{background:linear-gradient(120deg,#fff,#eef2f7,#fff);border-radius:10px;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:var(--shadow)}body.dark .hero{background:linear-gradient(120deg,#0d2a52,#12345f,#0d2a52)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}.logo img{width:42px;height:42px;object-fit:contain;display:block}h1{font-size:clamp(20px,2.5vw,30px);margin:0;letter-spacing:-1px}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.hero-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.last-update{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:750;color:var(--muted);white-space:nowrap;background:rgba(148,163,184,.1)}
button,input,select{font:inherit}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 12px}.control{padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);min-width:170px}.search{flex:1;min-width:230px}button{height:44px;cursor:pointer;border:0;border-radius:12px;padding:10px 15px;font-weight:750;background:var(--primary);color:#fff}button.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}button.icon{width:44px;min-width:44px;padding:8px;font-size:20px}button.icon img{width:24px;height:24px;object-fit:contain;display:block}button.icon .dark-icon{display:none}body.dark button.icon .light-icon{display:none}body.dark button.icon .dark-icon{display:block}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tab{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:11px 18px}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(var(--kpi-count,6),minmax(0,1fr));gap:10px;margin-top:12px;align-items:stretch}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);min-width:0}.label{font-size:12px;color:var(--muted);font-weight:750}.value{font-size:25px;font-weight:900;margin-top:7px;letter-spacing:-1px;text-align:left}.kpi-list{font-size:12px;line-height:1.25;letter-spacing:0;white-space:normal;overflow:hidden}.kpi-list div{display:flex;justify-content:space-between;gap:5px;min-width:0}.kpi-list div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kpi-list .kpi-pct{font-size:10px;opacity:.9;white-space:nowrap;flex:0 0 auto}.note{font-size:11px;color:var(--muted);margin-top:4px}
.tablecard{margin-top:15px}.tablehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tablehead h2{font-size:16px;margin:0}.table-actions{display:flex;gap:8px;align-items:center}.tablewrap{overflow:auto;max-height:620px;margin-top:12px;border:1px solid #cbd5e1;border-radius:9px;width:100%}.tablewrap table{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px;table-layout:fixed}.tablewrap th,.tablewrap td{padding:9px 8px;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;font-size:clamp(9px,0.72vw,12px);vertical-align:middle;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.28}.pct-progress{display:none}.pct-fill,.pct-label{display:none}.tablewrap th:last-child,.tablewrap td:last-child{border-right:0}.tablewrap tbody tr:nth-child(even){background:rgba(148,163,184,.075)}.tablewrap th{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;text-align:center;cursor:pointer;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.2}.tablewrap th:first-child,.tablewrap td:first-child{text-align:center}.tablewrap td:not(:first-child){text-align:center}.tablewrap td.block-cell{white-space:nowrap!important}.tablewrap td:first-child{font-weight:400}.kpi-list{font-size:11px!important;line-height:1.25;letter-spacing:0!important;text-align:left}.kpi-list>div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:5px;margin:2px 0}.kpi-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kpi-rank{font-weight:800;min-width:12px}.kpi-pct{display:inline-block;min-width:52px;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:900;text-align:center}.kpi-state{display:flex;justify-content:center}.kpi-count{text-align:center}.card .value{text-align:left}.kpi-state{justify-content:flex-start}.kpi-count{text-align:left}.tablewrap td.num{text-align:center;font-weight:750}.rank{font-weight:900}.block{font-weight:400}.pct{text-align:center;font-weight:850;white-space:normal}.empty{text-align:center;color:var(--muted);padding:30px}
.pct-badge{display:inline-block;padding:4px 9px;border-radius:4px;font-weight:900;border:0;min-width:58px;text-align:center;line-height:1.05;box-sizing:border-box;letter-spacing:.05px}.kpi-list{text-align:left}.kpi-list>div{text-align:left}.kpi-pct{display:inline-block;text-align:center;min-width:48px}.block-cell{text-align:left!important;font-weight:400;white-space:nowrap!important;overflow:hidden;text-overflow:ellipsis}.serial-cell{width:1%;text-align:center!important;font-weight:400!important;white-space:nowrap}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:850}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.legend span{font-size:10px;font-weight:800;padding:4px 7px;border-radius:5px}.foot{margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:11px;color:var(--muted);background:rgba(148,163,184,.08)}@media(min-width:801px){#kpiSection.kpi-single-row{grid-template-columns:repeat(var(--kpi-count),minmax(0,1fr))!important}}@media(max-width:800px){#kpiSection.kpi-single-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:1400px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.hero{display:block}.hero-actions{margin-top:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{display:grid;grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.control,button{width:100%;min-width:0}}@media(max-width:520px){.app{padding:12px}.kpis{grid-template-columns:1fr 1fr}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{width:100%}.toolbar{grid-template-columns:1fr}.search{grid-column:auto}.tablewrap{max-height:560px}}
</style>
</head>

<script>
const CONFIG={

 lastUpdatedGid:'237220054'
};
const ALIASES={
 block:['block','block name','blockname'],gp:['gp','gp name','gram panchayat','gram panchayat name','gram panchayat (gp)'],vo:['vo','vo name','village organisation','village organization'],shg:['shg','shg name','self help group','self-help group'],overall:['overall %','overall percentage','overall','overall achievement','overall achievement %','overall percentage (%)'],target:['target'],achievement:['achievement','achievement %','achieved','total achievement','actual'],district:['district','district name'],serial:['s.no','sl no','sl. no','serial no','sr no']
};
let state={level:'vo',matrix:[],headers:[],rows:[],filtered:[],sortKey:'overall',asc:false,stateOverall:null};
const $=id=>document.getElementById(id);
function norm(v){return String(v??'').toLowerCase().replace(/[%()\[\]{}_.\-\/]+/g,' ').replace(/\s+/g,' ').trim()}
function findHeader(headers,names){const ns=names.map(norm);let i=headers.findIndex(h=>ns.includes(norm(h)));if(i>=0)return i;return headers.findIndex(h=>ns.some(n=>norm(h).includes(n)))}
function number(v){if(typeof v==='number')return v;let s=String(v??'').replace(/,/g,'').replace(/%/g,'').trim();if(!s)return NaN;let n=Number(s);return Number.isFinite(n)?n:NaN}
function pctValue(v){let n=number(v);if(!Number.isFinite(n))return NaN;if(n>=0&&n<=1&&String(v).includes('%')===false)n*=100;return Math.max(0,Math.min(100,n))}
function colorFor(p){
 if(!Number.isFinite(p))return '#64748b';
 if(p<=0)return '#dc2626';
 return p>=90?'#16a34a':p>=80?'#0d9488':p>=60?'#ca8a04':p>=50?'#ea580c':p>=30?'#d97706':'#dc2626';
}
function bgFor(p){
 if(!Number.isFinite(p))return document.body.classList.contains('dark')?'#1e293b':'#f1f5f9';
 if(p<=0)return document.body.classList.contains('dark')?'#451a1a':'#fee2e2';
 return document.body.classList.contains('dark')
  ?(p>=90?'#14532d':p>=80?'#134e4a':p>=60?'#713f12':p>=50?'#7c2d12':p>=30?'#78350f':'#451a1a')
  :(p>=90?'#dcfce7':p>=80?'#ccfbf1':p>=60?'#fef3c7':p>=50?'#ffedd5':p>=30?'#fef3c7':'#fee2e2');
}
function badge(p){if(!Number.isFinite(p))return '<span class="pct-badge">—</span>';return `<span class="pct-badge" style="color:${colorFor(p)};background:${bgFor(p)}">${p.toFixed(1).replace('.0','')}%</span>`}
function gviz(url){return new Promise((resolve,reject)=>{const cb='gviz_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{cleanup();reject(new Error('Google Sheets request timed out'))},20000);function cleanup(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error('Google Sheets request failed'))};s.src=url+(url.includes('?')?'&':'?')+'tqx='+encodeURIComponent('responseHandler:'+cb);document.head.appendChild(s)})}
function matrixFromGviz(j){const t=j?.table||{};const cols=(t.cols||[]).map(c=>c.label||c.id||'');const rows=(t.rows||[]).map(r=>(r.c||[]).map(c=>c?.f??c?.v??''));return [cols,...rows]}
function parseRows(m){
 const headers=m[0].map(x=>String(x??'').trim());
 const nh=headers.map(norm),idx={};
 for(const k of Object.keys(ALIASES))idx[k]=findHeader(nh,ALIASES[k]);
 const rows=m.slice(1).filter(r=>r.some(v=>String(v??'').trim()!==''));
 return {headers,rows,idx,headerRow:1};
}
function isStateOverallRow(r,idx){
 const joined=r.map(v=>String(v??'').trim()).join(' ').toLowerCase().replace(/\s+/g,' ');
 const block=idx.block>=0?String(r[idx.block]??'').trim().toLowerCase():'';
 return /state\s*overall/.test(joined)||block==='state'||block==='state overall'||block==='mizoram overall';
}
function isTotalRow(r){
 const values=r.map(v=>String(v??'').trim().toLowerCase()).filter(Boolean);
 if(!values.length)return true;
 return values.some(v=>v==='total'||v==='grand total'||/^total\s+(achievement|records|target)$/i.test(v));
}
function buildRows(parsed){
 const {headers,rows,idx}=parsed;state.stateOverall=null;
 return rows.map((r,ri)=>{
  const x={_sourceRow:ri+3,_raw:r};
  headers.forEach((h,i)=>x[h||`Column ${i+1}`]=r[i]??'');
  x.block=idx.block>=0?String(r[idx.block]??'').trim():'';
  x.gp=idx.gp>=0?String(r[idx.gp]??'').trim():'';
  x.vo=idx.vo>=0?String(r[idx.vo]??'').trim():'';
  x.shg=idx.shg>=0?String(r[idx.shg]??'').trim():'';
  x.district=idx.district>=0?String(r[idx.district]??'').trim():'';
  x.overall=idx.overall>=0?pctValue(r[idx.overall]):NaN;
  x.target=idx.target>=0?number(r[idx.target]):NaN;
  x.achievement=idx.achievement>=0?pctValue(r[idx.achievement]):NaN;
  if(!Number.isFinite(x.overall)&&Number.isFinite(x.achievement))x.overall=x.achievement;
  return x;
 }).filter(x=>{
  if(isStateOverallRow(x._raw,idx)){state.stateOverall=x;return false}
  if(isTotalRow(x._raw))return false
  return x.block||x.gp||x.vo||x.shg||x._raw.some(v=>String(v??'').trim()!=='');
 });
}
function looksLikePercentageHeader(label){return /%|percent|percentage|overall|achievement/i.test(String(label??''));}
function columnIsPercentage(i){
 const label=String(state.headers[i]??'');
 if(i===state.parsed.idx.overall||looksLikePercentageHeader(label))return true;
 const vals=state.rows.map(r=>r._raw[i]).filter(v=>String(v??'').trim()!=='');
 if(!vals.length)return false;
 const nums=vals.map(v=>number(v));
 const numeric=nums.filter(Number.isFinite);
 if(numeric.length<Math.max(3,Math.ceil(vals.length*.7)))return false;
 const sample=numeric.slice(0,Math.min(20,numeric.length));
 return sample.every(v=>v>=0&&v<=100) && /rate|score|progress|completion|achievement|performance/i.test(label);
}
function displayColumns(){
 const h=state.headers, limit=state.level==='vo'?12:9, cols=[];
 for(let i=0;i<Math.min(limit,h.length);i++){
  const label=String(h[i]??'');
  const isSerial=i===state.parsed.idx.serial || /^(s\.?\s*no|sl\.?\s*no|serial\s*no|sr\.?\s*no)$/i.test(label.trim());
  cols.push({key:isSerial?'serial':`raw:${i}`,label,rawIndex:i,pct:columnIsPercentage(i),special:i===state.parsed.idx.overall?'overall':undefined,serial:isSerial,block:i===state.parsed.idx.block || /^(block|block name)$/i.test(label.trim())});
 }
 return cols;

 }catch(e){console.error('Image export failed:',e);alert('Unable to save image: '+e.message);}
}
